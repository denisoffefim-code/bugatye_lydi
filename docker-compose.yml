services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  forecast-service:
    build: .
    env_file:
      - .env
    environment:
      APP_MODULE: forecast_service.app:app
      APP_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      - redis
      - kafka
  telemetry-service:
    build: .
    env_file:
      - .env
    environment:
      APP_MODULE: telemetry_service.app:app
      APP_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      - redis
      - kafka
  analytics-api:
    build: .
    env_file:
      - .env
    environment:
      APP_MODULE: analytics_api.app:app
      APP_PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      - redis
      - kafka
  outbox-worker:
    build: .
    env_file:
      - .env
    environment:
      OUTBOX_SPOOL_DIR: /var/lib/skycast/outbox-spool
    command: ["python", "-m", "skycast.outbox_worker"]
    depends_on:
      - redis
      - kafka
    volumes:
      - outbox-spool:/var/lib/skycast/outbox-spool

volumes:
  outbox-spool:
