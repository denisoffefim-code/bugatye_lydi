apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecast-service
  namespace: skycast
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: forecast-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forecast-service
    spec:
      containers:
        - name: forecast-service
          image: cr.yandex/replace-me/skycast:replace-me
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_MODULE
              value: forecast_service.app:app
            - name: APP_PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: skycast-shared-config
            - secretRef:
                name: skycast-runtime-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
          volumeMounts:
            - name: yandex-ca
              mountPath: /etc/ssl/certs/yandex-cloud
              readOnly: true
      volumes:
        - name: yandex-ca
          secret:
            secretName: skycast-yandex-ca
---
apiVersion: v1
kind: Service
metadata:
  name: forecast-service
  namespace: skycast
spec:
  selector:
    app.kubernetes.io/name: forecast-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forecast-service
  namespace: skycast
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forecast-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: forecast-service
  namespace: skycast
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forecast-service
