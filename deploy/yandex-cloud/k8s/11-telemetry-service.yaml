apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-service
  namespace: skycast
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-service
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: telemetry-service
          image: cr.yandex/crp0uld88a95dqoql4bj/skycast:manual-20260708-02
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_MODULE
              value: telemetry_service.app:app
            - name: APP_PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: skycast-shared-config
            - secretRef:
                name: skycast-runtime-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
          volumeMounts:
            - name: yandex-ca
              mountPath: /etc/ssl/certs/yandex-cloud
              readOnly: true
      volumes:
        - name: yandex-ca
          secret:
            secretName: skycast-yandex-ca
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-service
  namespace: skycast
spec:
  selector:
    app.kubernetes.io/name: telemetry-service
  ports:
    - name: http
      port: 80
      targetPort: http
