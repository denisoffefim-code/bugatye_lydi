apiVersion: apps/v1
kind: Deployment
metadata:
  name: skycast-frontend
  namespace: skycast
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skycast-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skycast-frontend
    spec:
      containers:
        - name: skycast-frontend
          image: cr.yandex/crp0uld88a95dqoql4bj/skycast-frontend:git-735258c-ui-20260709-012713
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: skycast-frontend
  namespace: skycast
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: skycast-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
