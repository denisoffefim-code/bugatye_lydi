apiVersion: v1
kind: Service
metadata:
  name: outbox-worker
  namespace: skycast
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: outbox-worker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: outbox-worker
  namespace: skycast
spec:
  serviceName: outbox-worker
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: outbox-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outbox-worker
    spec:
      containers:
        - name: outbox-worker
          image: cr.yandex/replace-me/skycast:replace-me
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "skycast.outbox_worker"]
          envFrom:
            - configMapRef:
                name: skycast-shared-config
            - secretRef:
                name: skycast-runtime-secrets
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
          volumeMounts:
            - name: spool
              mountPath: /var/lib/skycast/outbox-spool
            - name: yandex-ca
              mountPath: /etc/ssl/certs/yandex-cloud
              readOnly: true
      volumes:
        - name: yandex-ca
          secret:
            secretName: skycast-yandex-ca
  volumeClaimTemplates:
    - metadata:
        name: spool
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: outbox-worker
  namespace: skycast
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: outbox-worker
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: outbox-worker
  namespace: skycast
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: outbox-worker
