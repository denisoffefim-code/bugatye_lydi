apiVersion: v1
kind: Service
metadata:
  name: outbox-worker
  namespace: skycast
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: outbox-worker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: outbox-worker
  namespace: skycast
spec:
  serviceName: outbox-worker
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: outbox-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outbox-worker
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: outbox-worker
          image: cr.yandex/crp0uld88a95dqoql4bj/skycast:manual-20260708-03
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "skycast.outbox_worker"]
          envFrom:
            - configMapRef:
                name: skycast-shared-config
            - secretRef:
                name: skycast-runtime-secrets
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
          volumeMounts:
            - name: spool
              mountPath: /var/lib/skycast/outbox-spool
            - name: yandex-ca
              mountPath: /etc/ssl/certs/yandex-cloud
              readOnly: true
      volumes:
        - name: yandex-ca
          secret:
            secretName: skycast-yandex-ca
  volumeClaimTemplates:
    - metadata:
        name: spool
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
